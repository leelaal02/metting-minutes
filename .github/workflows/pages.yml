# portfolio/ 폴더를 그대로 GitHub Pages로 배포한다.
# 소스 경로가 /docs로 고정되는 기본 방식 대신 Actions를 쓰는 이유는,
# 포트폴리오 파일을 portfolio/ 한 곳에만 두기 위해서다.
name: Deploy portfolio to Pages

on:
  push:
    branches: [main]
    paths:
      - "portfolio/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio
      - id: deployment
        uses: actions/deploy-pages@v4
